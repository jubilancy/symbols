<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>symbols</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f4ef;
    --text: #333;
    --text-dim: #767676;
    --accent: #b5624c;
    --border: #e4ddd0;
    --card-bg: #fdfcfa;
    --font: 'Victor Mono', ui-monospace, 'SF Mono', monospace;
  }

  [data-theme="dark"] {
    --bg: #1c1a17;
    --text: #e8e3d9;
    --text-dim: #9a9184;
    --accent: #e08a6f;
    --border: #34302a;
    --card-bg: #24211d;
  }

  @font-face {
    font-family: 'Victor Mono';
    src: local('Victor Mono');
    font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 3rem 1.25rem 5rem;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  h1::before {
    content: "✿ ";
    color: var(--accent);
  }

  .theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 0.75rem;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    cursor: pointer;
  }

  .theme-toggle:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .search-box {
    width: 100%;
    padding: 0.65rem 0.8rem;
    font-family: var(--font);
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
    margin-bottom: 0.75rem;
  }

  .search-box::placeholder { color: var(--text-dim); }

  .search-box:focus {
    outline: none;
    border-color: var(--accent);
  }

  .results-info {
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.75rem;
  }

  .item-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 0.9rem 0.7rem;
    border-radius: 8px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  .item-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .item-key {
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: lowercase;
    letter-spacing: 0.02em;
    margin-bottom: 0.5rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-value {
    font-size: 1.5rem;
    color: var(--text);
    word-break: break-word;
    line-height: 1.3;
    user-select: all;
  }

  .copied-msg {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--bg);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-family: var(--font);
    font-size: 0.8rem;
    animation: fadeUp 0.2s ease;
    z-index: 1000;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translate(-50%, 6px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  .no-results {
    color: var(--text-dim);
    padding: 2rem 0;
    font-size: 0.85rem;
    text-align: center;
    grid-column: 1 / -1;
  }

  footer {
    max-width: 640px;
    margin: 3rem auto 0;
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  footer a { color: var(--text-dim); }
  footer a:hover { color: var(--accent); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1rem;
  }

  .chip {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 0.7rem;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }

  .chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .chip small { opacity: 0.7; margin-left: 0.25rem; }

  .more-btn {
    grid-column: 1 / -1;
    justify-self: center;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 0.75rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
  }

  .more-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>symbols</h1>
      <button class="theme-toggle" id="theme-toggle">dark</button>
    </header>

    <input
      type="text"
      id="search"
      class="search-box"
      placeholder="search symbols..."
      autofocus
    />

    <nav class="chips" id="chips" aria-label="categories"></nav>

    <div class="results-info">
      <span id="count">loading...</span>
    </div>

    <div id="results" class="items-grid">
      <div class="no-results">loading items...</div>
    </div>
  </div>

  <footer>
    <a href="https://glosse.me">glosse.me</a>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
